services:
  - type: web
    name: newseland-backend
    env: python
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: cd Backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        fromDatabase:
          name: newseland-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend-app.vercel.app
