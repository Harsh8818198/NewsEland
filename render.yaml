version: "1"
services:
  - type: web
    name: newseland-backend
    env: python
    buildCommand: pip install -r Backend/requirements.txt && python -m spacy download en_core_web_sm
    startCommand: cd Backend && gunicorn -w 1 -k uvicorn.workers.UvicornWorker server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://thefinancechronicals1-cyu8log3u-lazycooks-projects.vercel.app
